name: CI Test Suite & Integrity Audit

on:
  push:
    branches: [ main, master, "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Audit (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Disable Git autocrlf on Windows (Preserve exact LF bytes)
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: pip install -e .

      - name: Verify Workspace Integrity & Original Reports
        run: python scripts/check_workspace.py

      - name: Verify Frozen Strategy Checksum Hashes (13 Files)
        run: python scripts/verify_frozen_hashes.py

      - name: Run Full Python Test Suite (63 tests)
        run: python -m unittest discover -s tests -v

      - name: Run Deterministic Offline CI Health Checks
        run: python scripts/check_offline_health.py

      - name: Live Binance Futures API Diagnostic (Separate & Optional)
        run: python scripts/diagnose_live_api.py
        continue-on-error: true

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
